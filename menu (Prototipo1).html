<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root{
    --blue-1:#071522;
    --blue-2:#0d2940;
    --blue-3:#174b70;
    --metal-1:#dcecff;
    --metal-2:#7ea9c9;
    --metal-3:#eaf5ff;
    --ink:#07131f;
  }

  body{
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
    color:#fff;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 50% 15%, rgba(99,180,235,.24), transparent 34%),
      linear-gradient(145deg,#02070c 0%,#071522 34%,#0c2941 66%,#02080e 100%);
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.18;
    background:
      repeating-linear-gradient(115deg, transparent 0 3px, rgba(255,255,255,.08) 4px 5px, transparent 6px 10px);
    mix-blend-mode:screen;
  }

  .card{
    width:100%;
    max-width:430px;
    padding:27px 18px 24px;
    border-radius:28px;
    position:relative;
    overflow:hidden;
    background:
      linear-gradient(145deg,rgba(19,61,91,.96),rgba(4,17,28,.98)),
      #0b2438;
    border:1px solid rgba(184,221,246,.34);
    box-shadow:
      0 28px 70px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -1px 0 rgba(0,0,0,.55);
  }

  .shine{
    position:absolute;
    width:260px;
    height:260px;
    top:-150px;
    right:-110px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(190,231,255,.35),transparent 68%);
    pointer-events:none;
  }

  h1{
    position:relative;
    text-align:center;
    font-size:23px;
    letter-spacing:.2px;
    color:#f3f9ff;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
  }

  .sub{
    position:relative;
    text-align:center;
    color:#a9c7dc;
    font-size:13px;
    margin:7px 0 24px;
  }

  .carousel{
    width:100%;
    overflow:hidden;
    touch-action:pan-y;
    padding:5px 0 12px;
  }

  .track{
    display:flex;
    gap:14px;
    transition:transform .42s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
  }

  .slide{
    flex:0 0 calc(100% - 54px);
    min-width:0;
    border:1px solid rgba(201,232,252,.38);
    border-radius:23px;
    padding:17px 15px 18px;
    color:#f7fbff;
    text-decoration:none;
    font:inherit;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    background:
      linear-gradient(150deg,rgba(36,94,135,.95),rgba(7,27,43,.98));
    box-shadow:
      0 14px 28px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.22);
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  .slide::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(120deg,rgba(255,255,255,.12),transparent 35%,rgba(255,255,255,.04));
  }

  .slide:focus-visible{ outline:3px solid #c9e8ff; outline-offset:2px; }

  .visual{
    width:128px;
    height:128px;
    margin:0 auto 14px;
    border-radius:50%;
    display:grid;
    place-items:center;
    position:relative;
    border:5px solid rgba(224,241,253,.75);
    box-shadow:
      0 10px 22px rgba(0,0,0,.32),
      inset 0 2px 8px rgba(255,255,255,.4),
      0 0 0 1px rgba(0,0,0,.25);
    overflow:hidden;
  }

  .visual svg{
    width:73px;
    height:73px;
    position:relative;
    z-index:1;
  }

  .instagram-visual{
    background:linear-gradient(135deg,#f7d35d 0%,#ef6a5f 38%,#c135a4 72%,#5d4bd8 100%);
  }

  .instagram-visual::before{
    content:"";
    position:absolute;
    width:92px;
    height:92px;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    top:-28px;
    right:-20px;
  }

  .rating-visual{ background:linear-gradient(145deg,#eef7ff,#8eb7d3 48%,#315f7d); }
  .transfer-visual{ background:linear-gradient(145deg,#f3f9ff,#9abbd2 48%,#3c6d8c); }
  .carta-visual{ background:linear-gradient(145deg,#f3f9ff,#8eb7d3 48%,#2c5a78); }

  .slide-title{
    text-align:center;
    font-size:19px;
    font-weight:800;
    letter-spacing:.2px;
  }

  .slide-desc{
    text-align:center;
    margin-top:6px;
    color:#bcd5e6;
    font-size:12.5px;
    line-height:1.35;
  }

  .dots{
    display:flex;
    justify-content:center;
    gap:7px;
    margin:7px 0 2px;
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#527b98;
    transition:.25s;
  }

  .dot.active{
    width:22px;
    border-radius:8px;
    background:linear-gradient(90deg,#b9dcf3,#fff);
  }

  .hint{
    text-align:center;
    color:#769bb5;
    font-size:11px;
    margin-top:8px;
  }

  #datos{
    display:none;
    margin-top:15px;
    border-radius:18px;
    padding:5px 16px;
    background:linear-gradient(145deg,rgba(5,20,32,.9),rgba(20,55,79,.82));
    border:1px solid rgba(184,221,246,.25);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
  }

  #datos.open{display:block;}

  .field{
    padding:11px 0;
    border-bottom:1px solid rgba(190,220,238,.15);
  }

  .field:last-child{border-bottom:none;}

  .label{
    font-size:11px;
    color:#8fb3ca;
    text-transform:uppercase;
    letter-spacing:.6px;
  }

  .value{
    margin-top:2px;
    font-size:14px;
    font-weight:650;
    color:#f0f8ff;
    word-break:break-word;
  }

  .metal-line{
    height:1px;
    margin:18px auto 0;
    width:72%;
    background:linear-gradient(90deg,transparent,#c9e8ff,transparent);
    opacity:.55;
  }

  .metal-note{
    text-align:center;
    margin-top:9px;
    font-size:10px;
    letter-spacing:1.5px;
    color:#8fb4ca;
    text-transform:uppercase;
  }

  @media (max-width:380px){
    .card{padding:23px 13px 20px;}
    .visual{width:112px;height:112px;}
    .slide{flex-basis:calc(100% - 42px);}
  }
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="shine"></div>
  </main>

<script>
const p = new URLSearchParams(location.search);
const card = document.getElementById("card");
const SVGNS = "http://www.w3.org/2000/svg";

function urlSegura(u) {
  u = (u || "").trim();
  if (!u) return "";
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  try {
    const x = new URL(u);
    return (x.protocol === "http:" || x.protocol === "https:") ? x.href : "";
  } catch (e) { return ""; }
}

function instagramUrl(v) {
  v = (v || "").trim().replace(/^@/, "");
  if (!v) return "";
  if (/instagram\.com/i.test(v) || /^https?:\/\//i.test(v)) return urlSegura(v);
  return "https://www.instagram.com/" + encodeURIComponent(v);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

// Iconos SVG (contenido estático, sin datos del usuario)
const ICONOS = {
  carta: '<rect x="24" y="16" width="52" height="68" rx="8" fill="#315f7d" stroke="white" stroke-width="5"/>' +
         '<path d="M36 36h28M36 50h28M36 64h18" stroke="white" stroke-width="5" stroke-linecap="round"/>',
  instagram: '<rect x="20" y="20" width="60" height="60" rx="17" stroke="white" stroke-width="7"/>' +
             '<circle cx="50" cy="50" r="14" stroke="white" stroke-width="7"/>' +
             '<circle cx="70" cy="30" r="4" fill="white"/>',
  maps: '<path d="M50 82c15-19 24-30 24-44a24 24 0 1 0-48 0c0 14 9 25 24 44Z" fill="#315f7d" stroke="white" stroke-width="5"/>' +
        '<circle cx="50" cy="38" r="8" fill="white"/>' +
        '<path d="m50 19 3.5 7.1 7.8 1.1-5.7 5.5 1.4 7.8-7-3.7-7 3.7 1.4-7.8-5.7-5.5 7.8-1.1L50 19Z" fill="#fff" opacity=".95"/>',
  transfer: '<rect x="17" y="27" width="66" height="46" rx="7" fill="#315f7d" stroke="white" stroke-width="5"/>' +
            '<path d="M17 40h66" stroke="white" stroke-width="5"/>' +
            '<path d="M28 58h22" stroke="white" stroke-width="5" stroke-linecap="round"/>' +
            '<path d="m61 56 8 8 8-8M69 64V47" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>'
};

function crearSlide(tag, visualCls, icono, titulo, desc) {
  const s = el(tag, "slide");
  const v = el("div", "visual " + visualCls);
  v.setAttribute("aria-hidden", "true");
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 100 100");
  svg.setAttribute("fill", "none");
  svg.innerHTML = ICONOS[icono];
  v.appendChild(svg);
  s.appendChild(v);
  s.appendChild(el("div", "slide-title", titulo));
  s.appendChild(el("div", "slide-desc", desc));
  return s;
}

function enlace(visualCls, icono, titulo, desc, href) {
  const a = crearSlide("a", visualCls, icono, titulo, desc);
  a.href = href;
  a.target = "_blank";
  a.rel = "noopener";
  return a;
}

const negocio = (p.get("n") || "").trim();
if (negocio) document.title = negocio;

card.appendChild(el("h1", "", negocio ? "¡Gracias por visitar " + negocio + "!" : "¡Gracias por visitarnos!"));

const ig = instagramUrl(p.get("ig"));
const maps = urlSegura(p.get("maps"));
const carta = urlSegura(p.get("carta"));

const DATOS = [
  ["Nombre", p.get("tn")],
  ["RUT", p.get("rut")],
  ["Banco", p.get("banco")],
  ["Tipo de cuenta", p.get("tipo")],
  ["N° de cuenta", p.get("cuenta")]
].filter(d => d[1] && d[1].trim()).map(d => [d[0], d[1].trim()]);

const slidesEls = [];
if (carta) slidesEls.push(enlace("carta-visual", "carta", "Ver carta", "Mira nuestra carta completa", carta));
if (ig) slidesEls.push(enlace("instagram-visual", "instagram", "Instagram", "Síguenos y descubre nuestro contenido", ig));
if (maps) slidesEls.push(enlace("rating-visual", "maps", "Valóranos", "Déjanos tu valoración en Google Maps", maps));

let btn = null, panel = null;
if (DATOS.length) {
  btn = crearSlide("button", "transfer-visual", "transfer", "Datos de transferencia", "Toca para ver y copiar los datos bancarios");
  btn.type = "button";
  slidesEls.push(btn);
  panel = el("div");
  panel.id = "datos";
  panel.setAttribute("aria-live", "polite");
  DATOS.forEach(([l, v]) => {
    const f = el("div", "field");
    f.appendChild(el("div", "label", l));
    f.appendChild(el("div", "value", v));
    panel.appendChild(f);
  });
}

if (!slidesEls.length) {
  card.appendChild(el("p", "sub", "Este menú aún no tiene opciones configuradas."));
} else {
  card.appendChild(el("p", "sub", slidesEls.length > 1 ? "Desliza para elegir una opción" : "Elige una opción"));

  const carousel = el("section", "carousel");
  carousel.setAttribute("aria-label", "Opciones");
  const track = el("div", "track");
  slidesEls.forEach(s => track.appendChild(s));
  carousel.appendChild(track);
  card.appendChild(carousel);

  const dotsBox = el("div", "dots");
  dotsBox.setAttribute("aria-hidden", "true");
  slidesEls.forEach((_, i) => dotsBox.appendChild(el("span", "dot" + (i === 0 ? " active" : ""))));
  card.appendChild(dotsBox);
  if (slidesEls.length > 1) card.appendChild(el("div", "hint", "Desliza ← →"));
  else dotsBox.style.display = "none";

  if (panel) card.appendChild(panel);

  // ===== Transferencia =====
  if (btn) {
    const titulo = btn.querySelector(".slide-title");
    function copiar(texto) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(texto);
      return new Promise((ok, fail) => {
        const t = document.createElement("textarea");
        t.value = texto;
        t.style.position = "fixed";
        t.style.opacity = "0";
        document.body.appendChild(t);
        t.select();
        try { document.execCommand("copy") ? ok() : fail(); } catch (e) { fail(e); }
        document.body.removeChild(t);
      });
    }
    btn.addEventListener("click", () => {
      panel.classList.add("open");
      copiar(DATOS.map(([l, v]) => l + ": " + v).join("\n")).then(() => {
        titulo.textContent = "¡Datos copiados!";
        setTimeout(() => { titulo.textContent = "Datos de transferencia"; }, 2000);
      }).catch(() => { titulo.textContent = "Copia los datos de abajo"; });
    });
  }

  // ===== Carrusel táctil tipo tarjetas =====
  const slides = slidesEls;
  const dots = [...dotsBox.querySelectorAll(".dot")];
  let index = 0, startX = 0, currentX = 0, dragging = false;

  function updateCarousel(animate = true) {
    track.style.transition = animate ? "transform .42s cubic-bezier(.22,.61,.36,1)" : "none";
    const gap = 14;
    const slideWidth = slides[0].getBoundingClientRect().width;
    const containerWidth = carousel.getBoundingClientRect().width;
    const offset = (containerWidth - slideWidth) / 2;
    track.style.transform = `translateX(${offset - index * (slideWidth + gap)}px)`;
    dots.forEach((d, i) => d.classList.toggle("active", i === index));
  }

  function goTo(next) {
    index = Math.max(0, Math.min(slides.length - 1, next));
    updateCarousel();
  }

  track.addEventListener("touchstart", e => {
    if (!e.touches[0]) return;
    dragging = true;
    startX = currentX = e.touches[0].clientX;
    track.style.transition = "none";
  }, { passive: true });

  track.addEventListener("touchmove", e => {
    if (!dragging || !e.touches[0]) return;
    currentX = e.touches[0].clientX;
  }, { passive: true });

  track.addEventListener("touchend", () => {
    if (!dragging) return;
    dragging = false;
    const delta = currentX - startX;
    if (Math.abs(delta) > 45) goTo(index + (delta < 0 ? 1 : -1));
    else updateCarousel();
  });

  window.addEventListener("resize", () => updateCarousel(false));
  window.addEventListener("load", () => updateCarousel(false));
  updateCarousel(false);

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") goTo(index + 1);
    if (e.key === "ArrowLeft") goTo(index - 1);
  });
}

const line = el("div", "metal-line");
card.appendChild(line);
card.appendChild(el("div", "metal-note", "Experiencia digital · Al toque"));
</script>
</body>
</html>
